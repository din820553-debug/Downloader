name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      SIGNING_AVAILABLE: ${{ secrets.DOWNLOADER_KEYSTORE_B64 != '' && secrets.DOWNLOADER_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run native engine tests and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Restore private signing key
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          KEY_BASE64: ${{ secrets.DOWNLOADER_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEY_BASE64" | base64 --decode > app/release-signing.jks
          test -s app/release-signing.jks
          chmod 600 app/release-signing.jks
      - name: Build updateable signed APK
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          DOWNLOADER_KEYSTORE_FILE: ${{ github.workspace }}/app/release-signing.jks
          DOWNLOADER_KEYSTORE_PASSWORD: ${{ secrets.DOWNLOADER_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare test and release APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Downloader-TEST-v2.1.0.apk
          if [ "$SIGNING_AVAILABLE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Downloader-Android-arm64-v2.1.0.apk
          fi
          ls -lh dist/*.apk
      - name: Warn about the larger legacy engine APK
        run: |
          find dist -type f -name '*.apk' -printf '%f: %s bytes\\n'
          echo "::notice::The HYBRID APK includes bundled yt-dlp + FFmpeg binaries and is significantly larger than the Kotlin-only 2.0.5 build. Do not bypass antivirus or banking-app warnings."

      - name: Verify APK integrity
        run: |
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 6
            unzip -t "$apk" | tail -n 1
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done
      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Downloader-Android-v2.1.0
          path: dist/*.apk
          retention-days: 30

      # GitHub-hosted runners sometimes cannot start the emulator (TCP 5554 refused).
      # Opt-in for manual diagnostics; do not fail normal APK publication.
      - name: Verify installation and launch on Android emulator
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r dist/Downloader-TEST-v2.1.0.apk
            adb shell pm path com.dindownloader.app.preview
            adb shell am start -W -n com.dindownloader.app.preview/com.dindownloader.app.MainActivity
            adb shell dumpsys package com.dindownloader.app.preview | grep -m 1 'versionName=2.1.0-test'

      - name: Publish direct TEST APK (separate app)
        if: env.SIGNING_AVAILABLE != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.1.0-test >/dev/null 2>&1; then
            echo "TEST release already published; keeping the original APK so its signature does not change."
          else
            gh release create v2.1.0-test dist/Downloader-TEST-v2.1.0.apk \
              --target "$GITHUB_SHA" \
              --title "Downloader 2.1.0 HYBRID · Kotlin + yt-dlp" \
              --prerelease \
              --notes "HYBRID test APK includes two selectable engines: lightweight native Kotlin and legacy yt-dlp + FFmpeg. Large APK due to bundled executable libraries. Debug signing key may differ between runs; do not bypass device security warnings." ||
              echo "::warning::GitHub denied release publishing. APK remains available in Actions > Artifacts; enable appropriate repository workflow permissions."
          fi

      - name: Publish permanently signed direct APK
        if: env.SIGNING_AVAILABLE == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.1.0 >/dev/null 2>&1; then
            gh release upload v2.1.0 dist/Downloader-Android-arm64-v2.1.0.apk --clobber
          else
            gh release create v2.1.0 dist/Downloader-Android-arm64-v2.1.0.apk \
              --target "$GITHUB_SHA" \
              --title "Downloader Android 2.1.0 HYBRID" \
              --notes "Downloader 2.1.0 HYBRID restores optional yt-dlp + FFmpeg engine alongside native Kotlin. Each task remembers selected engine; history and Downloads site folders remain common. Android 10+, ARM64."
          fi
      - name: Missing permanent signing secrets
        if: env.SIGNING_AVAILABLE != 'true'
        run: |
          echo "::warning::Signed release not published: repository secrets DOWNLOADER_KEYSTORE_B64 and DOWNLOADER_KEYSTORE_PASSWORD are required."
          echo "## Signed release awaiting owner setup" >> "$GITHUB_STEP_SUMMARY"
          echo "Create both repository Actions secrets from your private signing kit, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
