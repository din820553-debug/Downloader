name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare direct APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Downloader-Android-arm64-v1.0.1.apk
          ls -lh dist/*.apk
      - name: Check APK integrity
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Downloader-Android-arm64-v1.0.1.apk | head -n 8
          unzip -t dist/Downloader-Android-arm64-v1.0.1.apk | tail -n 2
      - name: Upload workflow artifact (ZIP fallback)
        uses: actions/upload-artifact@v4
        with:
          name: Downloader-Android-arm64
          path: dist/*.apk
          retention-days: 30
      - name: Publish direct APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            gh release upload v1.0.1 dist/Downloader-Android-arm64-v1.0.1.apk --clobber
          else
            gh release create v1.0.1 dist/Downloader-Android-arm64-v1.0.1.apk \
              --target "$GITHUB_SHA" \
              --title "Downloader Android v1.0.1" \
              --notes "Прямая установка APK без ZIP. Для Android 10+ с процессором ARM64. Экспериментальная версия; поддержка сайтов зависит от yt-dlp."
          fi
