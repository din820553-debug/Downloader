name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      SIGNING_AVAILABLE: ${{ secrets.DOWNLOADER_KEYSTORE_B64 != '' && secrets.DOWNLOADER_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run native engine tests and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Restore private signing key
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          KEY_BASE64: ${{ secrets.DOWNLOADER_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEY_BASE64" | base64 --decode > app/release-signing.jks
          test -s app/release-signing.jks
          chmod 600 app/release-signing.jks
      - name: Build updateable signed APK
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          DOWNLOADER_KEYSTORE_FILE: ${{ github.workspace }}/app/release-signing.jks
          DOWNLOADER_KEYSTORE_PASSWORD: ${{ secrets.DOWNLOADER_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare test and release APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Downloader-TEST-v2.0.2.apk
          if [ "$SIGNING_AVAILABLE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Downloader-Android-arm64-v2.0.2.apk
          fi
          ls -lh dist/*.apk
      - name: Verify APK integrity
        run: |
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 6
            unzip -t "$apk" | tail -n 1
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done
      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Downloader-Android-v2.0.2
          path: dist/*.apk
          retention-days: 30

      - name: Publish direct TEST APK (separate app)
        if: env.SIGNING_AVAILABLE != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.2-test dist/Downloader-TEST-v2.0.2.apk \
            --target "$GITHUB_SHA" \
            --title "Downloader 2.0.2 TEST · separate installation" \
            --prerelease \
            --notes "This experimental APK installs as com.dindownloader.app.test alongside older Downloader versions. It does not overwrite or delete their data. Test APK signatures can change between GitHub Actions runs. Set stable release signing secrets for future reliable in-place upgrades."

      - name: Publish permanently signed direct APK
        if: env.SIGNING_AVAILABLE == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.2 >/dev/null 2>&1; then
            gh release upload v2.0.2 dist/Downloader-Android-arm64-v2.0.2.apk --clobber
          else
            gh release create v2.0.2 dist/Downloader-Android-arm64-v2.0.2.apk \
              --target "$GITHUB_SHA" \
              --title "Downloader Android v2.0.2" \
              --notes "Native Kotlin engine bugfix: Twitch clip and VOD media resolution, HLS byte progress, authenticated stream probing, site folders, resume. Not all protected/region-restricted media is supported. Android 10+, ARM64."
          fi
      - name: Missing permanent signing secrets
        if: env.SIGNING_AVAILABLE != 'true'
        run: |
          echo "::warning::Signed release not published: repository secrets DOWNLOADER_KEYSTORE_B64 and DOWNLOADER_KEYSTORE_PASSWORD are required."
          echo "## Signed release awaiting owner setup" >> "$GITHUB_STEP_SUMMARY"
          echo "Create both repository Actions secrets from your private signing kit, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
